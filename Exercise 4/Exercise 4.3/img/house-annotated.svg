<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Annotated SVG house coordinate diagram</title>
  <desc id="desc">A simplified copy of the house picture with arrows and labels explaining SVG coordinates.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#fffaf0"/>
  <rect x="80" y="55" width="850" height="600" rx="18" fill="#bde7f5" stroke="#d27d2d" stroke-width="3"/>
  <g stroke="#d27d2d" stroke-width="7" stroke-linecap="round">
    <line x1="802.5" y1="80" x2="802.5" y2="64"/><line x1="802.5" y1="210" x2="802.5" y2="226"/>
    <line x1="737.5" y1="145" x2="721.5" y2="145"/><line x1="867.5" y1="145" x2="883.5" y2="145"/>
    <line x1="756.5" y1="99" x2="745.5" y2="88"/><line x1="848.5" y1="191" x2="859.5" y2="202"/>
    <line x1="848.5" y1="99" x2="859.5" y2="88"/><line x1="756.5" y1="191" x2="745.5" y2="202"/>
  </g>
  <circle cx="802.5" cy="145" r="49" fill="#f4bb44" stroke="#d27d2d" stroke-width="5"/>
  <ellipse cx="216" cy="145" rx="60" ry="26" fill="#fff"/>
  <rect x="80" y="492" width="850" height="163" fill="#77b85a"/>
  <path d="M505 655 C445 590 466 542 535 492" fill="none" stroke="#fff2cd" stroke-width="48"/>
  <rect x="356" y="325" width="332" height="200" rx="4" fill="#a0522d" stroke="#6f3517" stroke-width="5"/>
  <polygon points="322,329 522,158 722,329" fill="#6f3517" stroke="#4f260f" stroke-width="6"/>
  <g transform="translate(394 368) scale(.85)" fill="#fff2cd" stroke="#6f3517" stroke-width="5">
    <rect x="0" y="0" width="92" height="78" rx="5"/><line x1="46" y1="0" x2="46" y2="78"/><line x1="0" y1="39" x2="92" y2="39"/>
    <rect x="205" y="0" width="92" height="78" rx="5"/><line x1="251" y1="0" x2="251" y2="78"/><line x1="205" y1="39" x2="297" y2="39"/>
  </g>
  <rect x="492" y="419" width="66" height="106" fill="#a0522d"/>
  <text x="522" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#854322">Welcome Home</text>

  <g font-family="Arial, sans-serif" fill="#3e2712" font-size="18">
    <circle cx="80" cy="55" r="6" fill="#a0522d"/><path d="M80 55 L40 28" stroke="#a0522d" stroke-width="3" marker-start="url(#arrow)"/><text x="15" y="22" font-weight="700">SVG origin (0,0)</text>
    <circle cx="802.5" cy="145" r="6" fill="#a0522d"/><path d="M808 140 L985 80" stroke="#a0522d" stroke-width="3" marker-start="url(#arrow)"/><text x="965" y="48" font-weight="700">Circle</text><text x="965" y="72">cx=850, cy=105, r=58</text>
    <circle cx="522" cy="158" r="6" fill="#f4bb44"/><path d="M528 158 L988 170" stroke="#a0522d" stroke-width="3" marker-start="url(#arrow)"/><text x="966" y="150" font-weight="700">Roof polygon</text><text x="966" y="174">top point: (520,120)</text>
    <path d="M688 400 L985 285" stroke="#a0522d" stroke-width="3" marker-start="url(#arrow)"/><text x="966" y="250" font-weight="700">Rectangle</text><text x="966" y="274">x=325, y=315</text><text x="966" y="298">width=390, height=235</text>
    <path d="M394 368 L985 405" stroke="#a0522d" stroke-width="3" marker-start="url(#arrow)"/><text x="966" y="380" font-weight="700">Window group</text><text x="966" y="404">translate(370 365)</text>
    <path d="M505 640 L985 535" stroke="#a0522d" stroke-width="3" marker-start="url(#arrow)"/><text x="966" y="505" font-weight="700">Path</text><text x="966" y="529">starts with M 500 700</text>
    <path d="M522 130 L985 635" stroke="#a0522d" stroke-width="3" marker-start="url(#arrow)"/><text x="966" y="620" font-weight="700">Text</text><text x="966" y="644">x=520, y=92</text><text x="966" y="668">text-anchor=middle</text>
  </g>
</svg>
