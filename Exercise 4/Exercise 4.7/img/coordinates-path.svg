<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900"><title>path: coordinate annotation</title><rect width="1200" height="900" fill="white"/><defs><clipPath id="scene-clip"><rect width="1000" height="700"/></clipPath></defs><g transform="translate(70 60)"><g clip-path="url(#scene-clip)">             <title id="house-title">A customised house and garden made with SVG shapes</title>             <desc id="house-desc">A brown house with a dark brown roof, two grouped cream windows, a door, chimney, sun with rays, clouds, tree, flowers, fence and curved path.</desc>              <!-- Background rectangle, circular sun and elliptical clouds. -->             <rect x="0" y="0" width="1000" height="700" fill="#bde7f5"/>             <!-- Lines radiating from the sun demonstrate repeated line shapes. -->             <g stroke="#d27d2d" stroke-width="8" stroke-linecap="round">               <line x1="850" y1="22" x2="850" y2="2"/><line x1="850" y1="188" x2="850" y2="208"/>               <line x1="767" y1="105" x2="747" y2="105"/><line x1="933" y1="105" x2="953" y2="105"/>               <line x1="791" y1="46" x2="777" y2="32"/><line x1="909" y1="164" x2="923" y2="178"/>               <line x1="909" y1="46" x2="923" y2="32"/><line x1="791" y1="164" x2="777" y2="178"/>             </g>             <circle cx="850" cy="105" r="58" fill="#f4bb44" stroke="#d27d2d" stroke-width="6"/>             <g fill="#ffffff" opacity="0.9">               <ellipse cx="160" cy="105" rx="70" ry="30"/><ellipse cx="220" cy="102" rx="55" ry="38"/><ellipse cx="105" cy="112" rx="48" ry="25"/>             </g>              <!-- Grass and two layered Bézier paths form the garden and walkway. -->             <rect x="0" y="510" width="1000" height="190" fill="#77b85a"/>             <path d="M 500 700 C 430 625, 455 570, 535 510" fill="none" stroke="#f7d48b" stroke-width="74"/>             <path d="M 500 700 C 430 625, 455 570, 535 510" fill="none" stroke="#fff2cd" stroke-width="54"/>              <!-- House body, polygon roof, chimney rectangle and polyline cap. -->             <rect x="325" y="315" width="390" height="235" rx="5" fill="#a0522d" stroke="#6f3517" stroke-width="6"/>             <polygon points="285,320 520,120 755,320" fill="#6f3517" stroke="#4f260f" stroke-width="7" stroke-linejoin="round"/>             <rect x="625" y="154" width="55" height="112" fill="#87451f" stroke="#743914" stroke-width="5"/>             <polyline points="620,154 652,128 685,154" fill="#87451f" stroke="#743914" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>              <!-- Both windows share fill and stroke styling in one translated group. -->             <g class="windows" transform="translate(370 365)" fill="#fff2cd" stroke="#6f3517" stroke-width="5">               <rect x="0" y="0" width="92" height="78" rx="5"/><line x1="46" y1="0" x2="46" y2="78"/><line x1="0" y1="39" x2="92" y2="39"/>               <rect x="205" y="0" width="92" height="78" rx="5"/><line x1="251" y1="0" x2="251" y2="78"/><line x1="205" y1="39" x2="297" y2="39"/>             </g>              <!-- Door, doorknob and tree use rectangles and circles. -->             <rect x="484" y="425" width="78" height="125" rx="5" fill="#a0522d" stroke="#743914" stroke-width="5"/>             <circle cx="545" cy="490" r="7" fill="#f4bb44"/>             <rect x="140" y="390" width="34" height="165" fill="#8b572a"/>             <circle cx="157" cy="355" r="72" fill="#2f8f46"/><circle cx="105" cy="380" r="48" fill="#3da85b"/><circle cx="205" cy="380" r="50" fill="#3da85b"/>              <!-- Line groups create the fence and flower stems. -->             <g stroke="#8b572a" stroke-width="7" stroke-linecap="round">               <line x1="790" y1="465" x2="790" y2="560"/><line x1="860" y1="465" x2="860" y2="560"/><line x1="930" y1="465" x2="930" y2="560"/>               <line x1="760" y1="495" x2="965" y2="495"/><line x1="760" y1="535" x2="965" y2="535"/>             </g>             <g stroke="#2f8f46" stroke-width="5"><line x1="245" y1="525" x2="245" y2="570"/><line x1="740" y1="540" x2="740" y2="580"/></g>             <g fill="#d85c70"><circle cx="245" cy="520" r="13"/><circle cx="230" cy="530" r="13"/><circle cx="260" cy="530" r="13"/><circle cx="740" cy="535" r="13"/><circle cx="725" cy="545" r="13"/><circle cx="755" cy="545" r="13"/></g>              <!-- SVG text is positioned by x and y and centred with text-anchor. -->             <text x="520" y="92" text-anchor="middle" font-family="Baloo 2, sans-serif" font-size="34" font-weight="700" fill="#854322">Welcome Home</text>           </g><path d="M 0 730 V 0 H 1030" fill="none" stroke="#352315" stroke-width="4"/><text x="1010" y="-15" font-family="Arial" font-size="22">x →</text><text x="-48" y="730" font-family="Arial" font-size="22">y ↓</text><text x="0" y="-22" font-family="Arial" font-size="22">Origin (0,0)</text><path d="M 0 700 H 500 V 0" fill="none" stroke="#126aab" stroke-width="2" stroke-dasharray="8 6"/><circle cx="500" cy="700" r="9" fill="#126aab" stroke="white" stroke-width="3"/><text x="512" y="688" font-size="22" font-family="Arial" font-weight="bold" fill="#126aab" stroke="white" stroke-width="4" paint-order="stroke">1</text><path d="M 0 625 H 430 V 0" fill="none" stroke="#126aab" stroke-width="2" stroke-dasharray="8 6"/><circle cx="430" cy="625" r="9" fill="#126aab" stroke="white" stroke-width="3"/><text x="442" y="613" font-size="22" font-family="Arial" font-weight="bold" fill="#126aab" stroke="white" stroke-width="4" paint-order="stroke">2</text><path d="M 0 570 H 455 V 0" fill="none" stroke="#126aab" stroke-width="2" stroke-dasharray="8 6"/><circle cx="455" cy="570" r="9" fill="#126aab" stroke="white" stroke-width="3"/><text x="467" y="558" font-size="22" font-family="Arial" font-weight="bold" fill="#126aab" stroke="white" stroke-width="4" paint-order="stroke">3</text><path d="M 0 510 H 535 V 0" fill="none" stroke="#126aab" stroke-width="2" stroke-dasharray="8 6"/><circle cx="535" cy="510" r="9" fill="#126aab" stroke="white" stroke-width="3"/><text x="547" y="498" font-size="22" font-family="Arial" font-weight="bold" fill="#126aab" stroke="white" stroke-width="4" paint-order="stroke">4</text></g><g font-family="Arial" font-size="20" fill="#126aab"><text x="70" y="810">1: (500, 700)</text><text x="600" y="810">2: (430, 625) — control point</text><text x="70" y="842">3: (455, 570) — control point</text><text x="600" y="842">4: (535, 510)</text></g></svg>
